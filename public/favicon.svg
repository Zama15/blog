<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800"><style>
    /* COLORS */
    .bg     { fill: #fff; }
    .letter { fill: #212529; }
    .line {
      fill: none;
      stroke: #212529;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* DARK MODE */
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #212529; }
      .letter { fill: #dee2e6; }
      .line { stroke: #dee2e6; }
    }
  </style><rect class="bg" width="100%" height="100%" rx="100"></rect><svg y="0%" width="100%" height="100%" viewBox="0 0 32 32">
    <path class="line" transform="translate(0 0)" d="M 8 4
         H 24
         L 8 28
         H 24"></path>
  </svg></svg>